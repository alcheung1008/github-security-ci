name: CI with Security Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install safety bandit

      - name: Run unit tests
        run: |
          python -m pytest -v tests/

      - name: Security Check 1 - Dependency Scan
        continue-on-error: true
        run: |
          echo "Checking for vulnerable Python dependencies..."
          safety check

      - name: Security Check 2 - Code Security Scan
        continue-on-error: true
        run: |
          echo "Scanning Python source code for security issues..."
          bandit -r sample_code.py -ll